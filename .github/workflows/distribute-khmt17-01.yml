name: Distribute CSC4007 to KHMT 17-01

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử, không tạo repo hoặc gửi lời mời"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: distribute-csc4007-khmt17-01
  cancel-in-progress: false

jobs:
  distribute:
    if: github.repository == 'TrangLe1912/csc4007-hello-nlp-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout starter repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate distributor
        run: python -m py_compile .github/classroom/distribute.py

      - name: Create repositories and invite students
        env:
          CLASSROOM_PAT: ${{ secrets.CLASSROOM_PAT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/classroom/distribute.py
